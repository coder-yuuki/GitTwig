name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Package and verify relocated app
        run: scripts/package-macos.sh
